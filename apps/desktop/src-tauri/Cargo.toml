[package]
name = "lizzieyzy-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "lizzieyzy-desktop"

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"
required-features = ["dev-tools"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "~2.7", features = [] }

[dependencies]
tauri = { version = "~2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "~2.14.1"
tauri-plugin-opener = "~2.7.3"
app-core = { path = "../../../crates/app-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "fs"] }
ts-rs = "11"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tauri = { version = "~2.12", features = ["test"] }
fake-katago = { path = "../../../tools/fake-katago" }
tempfile = "3"
# Local HTTP fixtures only; the actor runtime features remain in dependencies.
tokio = { version = "1", features = ["net", "io-util"] }

[features]
default = ["dev-tools"]
dev-tools = []
custom-protocol = ["tauri/custom-protocol"]
