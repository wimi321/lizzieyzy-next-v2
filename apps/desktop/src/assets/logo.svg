<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <linearGradient id="wood" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#F0CF8E"/>
      <stop offset="0.5" stop-color="#E2B266"/>
      <stop offset="1" stop-color="#C98C42"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0028 0.05" numOctaves="2" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.25  0 0 0 0 0.09  0 0 0 1.4 -0.55"/>
    </filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.32" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#5A3510" stop-opacity="0"/>
      <stop offset="1" stop-color="#5A3510" stop-opacity="0.22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.85">
      <stop offset="0" stop-color="#FFF6DD" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#FFF6DD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="black" cx="0.36" cy="0.30" r="0.78">
      <stop offset="0" stop-color="#6B6B70"/>
      <stop offset="0.28" stop-color="#2C2C31"/>
      <stop offset="0.75" stop-color="#0D0D10"/>
      <stop offset="1" stop-color="#030304"/>
    </radialGradient>
    <radialGradient id="white" cx="0.36" cy="0.30" r="0.82">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#F4F0E7"/>
      <stop offset="0.85" stop-color="#DCD3C1"/>
      <stop offset="1" stop-color="#C2B79F"/>
    </radialGradient>
    <radialGradient id="green" cx="0.4" cy="0.34" r="0.8">
      <stop offset="0" stop-color="#5DD597"/>
      <stop offset="0.7" stop-color="#3CC47F"/>
      <stop offset="1" stop-color="#2AA866"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="13"/>
      <feOffset dx="6" dy="18" result="blur"/>
      <feComponentTransfer in="blur" result="soft"><feFuncA type="linear" slope="0.42"/></feComponentTransfer>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect x="104" y="122" width="816" height="816" rx="186" fill="#2A1606" opacity="0.30" filter="url(#tileShadow)"/>

  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#wood)"/>
    <rect x="100" y="100" width="824" height="824" filter="url(#grain)" opacity="0.19"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <g stroke="#3A2312" stroke-opacity="0.58" stroke-width="9" stroke-linecap="butt">
      <line x1="382" y1="100" x2="382" y2="924"/>
      <line x1="642" y1="100" x2="642" y2="924"/>
      <line x1="100" y1="382" x2="924" y2="382"/>
      <line x1="100" y1="642" x2="924" y2="642"/>
    </g>
    <circle cx="382" cy="642" r="16" fill="#3A2312" fill-opacity="0.7"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"/>

  <circle cx="642" cy="382" r="104" fill="none" stroke="#3CC47F" stroke-opacity="0.32" stroke-width="7"/>
  <g filter="url(#shadow)">
    <circle cx="642" cy="382" r="80" fill="url(#green)"/>
  </g>
  <circle cx="642" cy="382" r="77" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="6"/>

  <g filter="url(#shadow)">
    <circle cx="382" cy="382" r="128" fill="url(#white)"/>
    <circle cx="642" cy="642" r="128" fill="url(#black)"/>
  </g>
  <ellipse cx="350" cy="336" rx="52" ry="30" fill="#FFFFFF" opacity="0.65" transform="rotate(-28 350 336)"/>
  <ellipse cx="606" cy="592" rx="46" ry="24" fill="#FFFFFF" opacity="0.16" transform="rotate(-28 606 592)"/>
</svg>
