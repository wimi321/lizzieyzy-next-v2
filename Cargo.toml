[workspace]
resolver = "3"
members = [
    "crates/go-core",
    "crates/sgf",
    "crates/document",
    "crates/katago-protocol",
    "crates/engine-session",
    "crates/analysis",
    "crates/fox-kifu",
    "crates/strength",
    "crates/readboard",
    "crates/app-core",
    "tools/fake-katago",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "GPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
