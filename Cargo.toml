[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/go-core",
    "crates/gtp",
    "crates/sgf",
    "crates/document",
    "crates/katago-protocol",
    "crates/engine-session",
    "crates/analysis",
    "crates/fox-kifu",
    "crates/strength",
    "crates/readboard",
    "crates/commentary",
    "crates/board-capture",
    "crates/app-core",
    "tools/fake-katago",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "GPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Asset verification hashes engine binaries and archives several times. Keep
# SHA-256 fast in tauri dev and tests (which inherit dev), without optimizing
# application code or weakening the five-second test safety deadlines.
[profile.dev.package."sha2@0.10.9"]
opt-level = 3
