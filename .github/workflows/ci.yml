name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: macos-latest
            python: python3
          - os: windows-latest
            python: python
    defaults:
      run:
        shell: bash
    env:
      PYTHON: ${{ matrix.python }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl wget file pkg-config libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Verify
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          scripts/verify.sh

      - name: Install Playwright Chromium
        if: runner.os == 'Linux'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          pnpm -C apps/desktop exec playwright install --with-deps chromium

      - name: Verify with web E2E
        if: runner.os == 'Linux'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          scripts/verify.sh --e2e
