name: Supply chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.96.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install pinned cargo-deny
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install cargo-deny --version =0.20.2 --locked
      - name: Check advisories, licenses, bans, and sources
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo deny --locked check

  pnpm-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/desktop/package.json
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frozen dependencies without lifecycle scripts
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          pnpm -C apps/desktop install --frozen-lockfile --ignore-scripts
      - name: Audit production and development dependencies
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          pnpm -C apps/desktop audit --audit-level high

  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Rust toolchain
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.96.0 --profile minimal
      - name: Install hash-locked SBOM tooling
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          python -m pip install --require-hashes --only-binary :all: -r scripts/packaging/sbom-requirements.txt
      - name: Test SBOM helpers without network
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          python -m unittest discover -s scripts/packaging -p 'sbom_tests.py' -v
