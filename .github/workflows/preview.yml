name: Preview installers

on:
  workflow_dispatch:
  # Formal-release workflows can call this job instead of maintaining a second
  # download / packaging / acceptance path.
  workflow_call:
    inputs:
      artifact_prefix:
        type: string
        default: preview
      retention_days:
        type: number
        default: 14
      release_version:
        description: Nonempty only for the release caller; preview behavior is unchanged.
        type: string
        default: ''
      build_matrix:
        description: Optional release matrix, including the Intel macOS runner.
        type: string
        default: ''
    secrets:
      LIZZIE_UPDATER_PUBKEY:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.release_version && 'release-packaging' || 'preview' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Preview (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.build_matrix || '{"include":[{"os":"windows-latest","platform":"windows","python":"python","bundles":"nsis","artifacts":"target/release/bundle/nsis/*.exe"},{"os":"macos-latest","platform":"macos","python":"python3","bundles":"dmg","artifacts":"target/release/bundle/dmg/*.dmg"},{"os":"ubuntu-24.04","platform":"linux","python":"python3","bundles":"appimage,deb","artifacts":"target/release/bundle/appimage/*.AppImage\ntarget/release/bundle/deb/*.deb"}]}') }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      PYTHON: ${{ matrix.python }}
      PYTHONIOENCODING: utf-8
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select bundled engine platform and start timer
        id: platform
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "PACKAGING_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Windows/X64) platform=windows-x64 ;;
            Linux/X64) platform=linux-x64 ;;
            macOS/ARM64) platform=macos-arm64 ;;
            macOS/X64) platform=macos-amd64 ;;
            *) echo "Unsupported bundle platform: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          echo "engine=$platform" >> "$GITHUB_OUTPUT"

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl wget file pkg-config libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf webkit2gtk-driver xvfb xauth dbus-x11

      - name: Install Rust toolchain
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      # rust-cache saves target/ and empties the directories it does not know,
      # so the next run on the branch restores an empty bundled-resources that
      # bundle.py refuses to replace. Packaging output is always rebuilt here.
      - name: Remove packaging output restored with the Rust cache
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rm -rf target/bundled-resources target/packaging-acceptance \
            target/release-assets target/native-signing target/release-version.json \
            target/release/bundle

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
          run_install: false

      - uses: actions/setup-node@v7
        with:
          # The Node CI tests with; lts/* is Node 26 since 2026-11.
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          pnpm -C apps/desktop install --frozen-lockfile

      - name: Test packaging helpers without network
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          "$PYTHON" -m unittest discover -s scripts/packaging -p 'test_*.py' -v

      - name: Cache pinned downloads
        uses: actions/cache@v5
        with:
          path: target/packaging-cache
          key: bundled-v1-${{ steps.platform.outputs.engine }}-${{ hashFiles('resources/katago/*.json', 'scripts/packaging/*.py') }}

      - name: Configure optional release signing
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          LIZZIE_UPDATER_PUBKEY: ${{ secrets.LIZZIE_UPDATER_PUBKEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          "$PYTHON" scripts/packaging/release_workflow.py configure --output target/release-version.json
          "$PYTHON" scripts/packaging/native_signing.py setup \
            --platform "${{ steps.platform.outputs.engine }}" \
            --directory target/native-signing --config target/native-signing/tauri.conf.json

      - name: Prepare and verify bundled resources
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          started_at=$(date +%s)
          release_args=()
          if [ -n "$RELEASE_VERSION" ]; then release_args=(--release-signing); fi
          "$PYTHON" scripts/packaging/bundle.py prepare "${release_args[@]}" \
            --platform "${{ steps.platform.outputs.engine }}" \
            --cache target/packaging-cache --output target/bundled-resources
          printf 'Resource download, SHA-256 verification and staging: %s seconds.\n' \
            "$(( $(date +%s) - started_at ))" >> "$GITHUB_STEP_SUMMARY"

      # Previews have no publisher credentials. macOS needs ad-hoc signing
      # after Tauri patches its executable; signingIdentity is "-" in the override.
      # The engine and dylibs were individually signed before their hash receipt.
      - name: Build installers
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          LIZZIE_UPDATER_PUBKEY: ${{ inputs.release_version != '' && secrets.LIZZIE_UPDATER_PUBKEY || '' }}
          APPLE_ID: ${{ inputs.release_version != '' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.release_version != '' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.release_version != '' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          started_at=$(date +%s)
          wrapper=()
          release_config=()
          signing_args=(--no-sign)
          if [ "$RUNNER_OS" = macOS ]; then signing_args=(); fi
          if [ -n "$RELEASE_VERSION" ]; then
            wrapper=("$PYTHON" scripts/packaging/native_signing.py build --directory target/native-signing --)
            release_config=(--config "$GITHUB_WORKSPACE/target/native-signing/tauri.conf.json"
              --config "$GITHUB_WORKSPACE/target/release-version.json")
            signing_args=()
          else
            # Tauri treats even an empty Apple environment variable as configured.
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID LIZZIE_UPDATER_PUBKEY
          fi
          "${wrapper[@]}" pnpm -C apps/desktop tauri build --ci "${signing_args[@]}" \
            --config src-tauri/tauri.bundled.conf.json \
            "${release_config[@]}" \
            --bundles "${{ matrix.bundles }}" -- --locked --no-default-features
          printf 'Installer compilation and packaging: %s seconds.\n' \
            "$(( $(date +%s) - started_at ))" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify app notarization and notarize the DMG
        if: inputs.release_version != '' && runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          shopt -s nullglob
          # Tauri removes the standalone .app once the DMG exists; the helper
          # checks the stapled app inside the DMG.
          dmgs=(target/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected exactly one DMG, found ${#dmgs[@]}" >&2
            exit 1
          fi
          "$PYTHON" scripts/packaging/native_signing.py notarize --directory target/native-signing \
            --dmg "${dmgs[0]}"

      - name: Extract installers and compare bundled hashes
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          shopt -s nullglob
          installers=(target/release/bundle/nsis/*.exe target/release/bundle/dmg/*.dmg \
            target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb)
          test "${#installers[@]}" -gt 0
          for installer in "${installers[@]}"; do
            format=$(basename "$(dirname "$installer")")
            "$PYTHON" scripts/packaging/acceptance.py \
              --platform "${{ steps.platform.outputs.engine }}" \
              --staged target/bundled-resources --installer "$installer" \
              --output "target/packaging-acceptance/$format"
          done

      - name: Install Linux application WebDriver
        if: runner.os == 'Linux'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install tauri-driver --locked --version '=2.1.0'

      - name: Install WebView2-matched Microsoft Edge WebDriver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$HOME/.cargo/bin;$env:PATH"
          $ErrorActionPreference = 'Stop'
          $runtimeKeys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $runtimeVersion = $null
          foreach ($key in $runtimeKeys) {
            $candidate = Get-ItemPropertyValue -Path $key -Name pv -ErrorAction SilentlyContinue
            if ($candidate -match '^\d+\.\d+\.\d+\.\d+$' -and $candidate -ne '0.0.0.0') {
              $runtimeVersion = $candidate
              break
            }
          }
          if (-not $runtimeVersion) { throw 'WebView2 Runtime version was not found' }
          $driverDirectory = Join-Path $env:RUNNER_TEMP 'bundled-engine-webdriver'
          $archive = Join-Path $env:RUNNER_TEMP 'bundled-engine-webdriver.zip'
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$runtimeVersion/edgedriver_win64.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $driverDirectory
          $driver = Join-Path $driverDirectory 'msedgedriver.exe'
          $signature = Get-AuthenticodeSignature $driver
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw 'Microsoft Edge WebDriver signature is invalid'
          }
          $driverVersion = (& $driver --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $driverVersion -notmatch '^Microsoft Edge WebDriver (\d+\.\d+\.\d+)\.') {
            throw "Invalid Microsoft Edge WebDriver version: $driverVersion"
          }
          if ($Matches[1] -ne (($runtimeVersion -split '\.')[0..2] -join '.')) {
            throw "WebView2 Runtime $runtimeVersion does not match $driverVersion"
          }
          "BUNDLED_SMOKE_DRIVER=$driver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WebView2: $runtimeVersion; driver: $driverVersion" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Check clean-profile B11 auto configuration (Linux)
        if: runner.os == 'Linux'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          for format in appimage deb; do
            dbus-run-session -- xvfb-run -a --server-args='-screen 0 1280x1024x24' \
              "$PYTHON" scripts/packaging/smoke.py \
                --acceptance-dir "target/packaging-acceptance/$format" \
                --driver "$HOME/.cargo/bin/tauri-driver"
          done

      - name: Check clean-profile B11 auto configuration (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$HOME/.cargo/bin;$env:PATH"
          & ./scripts/packaging/smoke-windows.ps1 -AcceptanceDir target/packaging-acceptance/nsis -Driver $env:BUNDLED_SMOKE_DRIVER

      - name: Restore Windows smoke WebView2 policy
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$HOME/.cargo/bin;$env:PATH"
          & ./scripts/packaging/smoke-windows.ps1 -Action Restore -AcceptanceDir target/packaging-acceptance/nsis -Driver $env:BUNDLED_SMOKE_DRIVER

      - name: Collect release installers and portable archives
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          acceptance_args=()
          case "$RUNNER_OS" in
            Windows) acceptance_args=(--acceptance-dir target/packaging-acceptance/nsis) ;;
            macOS) acceptance_args=(--acceptance-dir target/packaging-acceptance/dmg) ;;
          esac
          "$PYTHON" scripts/packaging/release_assets.py collect \
            --platform "${{ steps.platform.outputs.engine }}" --version "$RELEASE_VERSION" \
            --bundle-dir target/release/bundle --staged target/bundled-resources \
            "${acceptance_args[@]}" --output target/release-assets

      - name: Upload release assets
        if: inputs.release_version != ''
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-${{ steps.platform.outputs.engine }}-${{ github.run_id }}
          path: target/release-assets/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 14 }}

      - name: Upload preview installers
        if: inputs.release_version == ''
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_prefix || 'preview' }}-${{ matrix.platform }}-${{ runner.arch }}-${{ github.run_id }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 14 }}

      - name: Remove temporary signing credentials
        if: always() && inputs.release_version != ''
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          "$PYTHON" scripts/packaging/native_signing.py cleanup --directory target/native-signing

      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: packaging-diagnostics-${{ matrix.platform }}-${{ runner.arch }}-${{ github.run_id }}
          path: |
            target/bundled-resources/bundle-manifest.json
            target/packaging-acceptance/**/*.json
            target/packaging-acceptance/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Report total packaging time
        if: always()
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          printf 'Packaging job steps: %s seconds (limit: 90 minutes).\n' \
            "$(( $(date +%s) - PACKAGING_STARTED_AT ))" >> "$GITHUB_STEP_SUMMARY"
