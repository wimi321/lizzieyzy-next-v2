name: Core performance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-performance-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.96.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: core-performance
      - name: Check release performance limits
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo bench -p app-core --bench performance --locked -- --check --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload performance measurements
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-performance-linux
          path: target/bench/performance.json
          if-no-files-found: error
          retention-days: 14
