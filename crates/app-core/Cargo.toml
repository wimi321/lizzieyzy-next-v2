[package]
name = "app-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
analysis = { path = "../analysis" }
commentary = { path = "../commentary" }
document = { path = "../document" }
engine-session = { path = "../engine-session" }
fox-kifu = { path = "../fox-kifu" }
go-core = { path = "../go-core" }
gtp = { path = "../gtp" }
sgf = { path = "../sgf" }
strength = { path = "../strength" }
readboard = { path = "../readboard" }
katago-protocol = { path = "../katago-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "fs", "process", "io-util"] }
ts-rs = "11"
blake3 = "1"
sha2 = "0.10"
tempfile = "3"
zip = { version = "9.5", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
sys-locale = "0.3"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.10"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
fake-katago = { path = "../../tools/fake-katago" }
proptest = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["test-util", "net", "io-util"] }

[lints]
workspace = true
