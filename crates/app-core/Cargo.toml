[package]
name = "app-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
analysis = { path = "../analysis" }
document = { path = "../document" }
engine-session = { path = "../engine-session" }
fox-kifu = { path = "../fox-kifu" }
go-core = { path = "../go-core" }
sgf = { path = "../sgf" }
strength = { path = "../strength" }
readboard = { path = "../readboard" }
katago-protocol = { path = "../katago-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "fs", "process", "io-util"] }
ts-rs = "11"
blake3 = "1"
sha2 = "0.10"
tempfile = "3"
zip = { version = "9.5", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
sys-locale = "0.3"
png = "0.18"

[dev-dependencies]
fake-katago = { path = "../../tools/fake-katago" }
proptest = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["test-util", "net", "io-util"] }

[lints]
workspace = true
