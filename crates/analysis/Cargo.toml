[package]
name = "analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
document = { version = "0.1.0", path = "../document" }
go-core = { version = "0.1.0", path = "../go-core" }
katago-protocol = { version = "0.1.0", path = "../katago-protocol" }
engine-session = { version = "0.1.0", path = "../engine-session" }
# SQLite >=3.54 fixes RUSTSEC-2026-0459; keep the existing checked u64 reads.
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
fake-katago = { version = "0.1.0", path = "../../tools/fake-katago" }
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
