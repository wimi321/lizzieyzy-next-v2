[package]
name = "engine-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gtp = { path = "../gtp" }
katago-protocol = { path = "../katago-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa"] }
url = "2"

[dev-dependencies]
fake-katago = { path = "../../tools/fake-katago" }
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
rand = "0.10"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[lints]
workspace = true
