[package]
name = "engine-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
katago-protocol = { path = "../katago-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
fake-katago = { path = "../../tools/fake-katago" }
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
